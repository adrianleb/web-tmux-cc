<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1e2127">
  <meta name="application-name" content="web-tmux-cc">
  <meta name="apple-mobile-web-app-title" content="web-tmux-cc">
  <title>web-tmux-cc</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="web-tmux-cc-root" aria-label="tmux terminal">
    <div data-tmux-cc-loading role="status" aria-live="polite">
      <img src="./icon.svg" alt="">
      <strong>web-tmux-cc</strong>
      <span>Loading terminal…</span>
    </div>
  </main>
  <noscript>Enable JavaScript to use the terminal.</noscript>
</body>
</html>
